{% extends "base.html" %}
{% block title %}{{ post.title }} - Trekora{% endblock %}
{% block content %}

<section class="post-detail">
    <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="post-detail-img">

    <div class="post-detail-body">
        <h1>{{ post.title }}</h1>
        <p class="blog-meta">{{ post.author.username }} &bull; {{ post.published_at|date:"M d, Y" }}</p>
        <div class="post-content">
            {{ post.content|linebreaks }}
        </div>
    </div>
</section>

{% endblock %}

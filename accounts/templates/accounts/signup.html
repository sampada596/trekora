{% extends "base.html" %}
{% block title %}Sign Up - Trekora{% endblock %}
{% block content %}
<section class="auth-page">
    <h1>Create an Account</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-filled">Sign Up</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</section>
{% endblock %}

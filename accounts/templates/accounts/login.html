{% extends "base.html" %}
{% block title %}Login - Trekora{% endblock %}
{% block content %}
<section class="auth-page">
    <h1>Welcome Back</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-filled">Log In</button>
    </form>
    <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
</section>
{% endblock %}
